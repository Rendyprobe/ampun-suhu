<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Suhu ESP32 + DHT22</title>

  <!-- MQTT over WebSocket -->
  <script src="https://unpkg.com"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1020;
      color: #f4f7fb;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .container {
      width: min(900px, 100%);
    }

    .header {
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .subtitle {
      color: #aeb8cc;
      margin: 0;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #171e31;
      color: #aeb8cc;
      font-size: 14px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
    }

    .connected .dot { background: #22c55e; }
    .error .dot { background: #ef4444; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #12192b;
      border: 1px solid #26314b;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.25);
    }

    .label {
      color: #aeb8cc;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .value {
      font-size: clamp(44px, 10vw, 72px);
      font-weight: 700;
      letter-spacing: -2px;
    }

    .unit {
      font-size: 20px;
      color: #aeb8cc;
      margin-left: 5px;
    }

    .history {
      margin-top: 18px;
    }

    canvas {
      width: 100%;
      height: 230px;
      display: block;
      background: #0e1526;
      border-radius: 14px;
    }

    .meta {
      margin-top: 14px;
      color: #8f9ab0;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="header">
      <h1>🌡️ Dashboard Suhu</h1>
      <p class="subtitle">ESP32 + DHT22 → MQTT (EMQX) → Web Dashboard</p>

      <div id="status" class="status">
        <span class="dot"></span>
        <span id="statusText">Menghubungkan ke MQTT...</span>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="label">SUHU SAAT INI</div>
        <div>
          <span id="temperature" class="value">--.-</span>
          <span class="unit">°C</span>
        </div>
      </div>

      <div class="card">
        <div class="label">KELEMBAPAN</div>
        <div>
          <span id="humidity" class="value">--.-</span>
          <span class="unit">%</span>
        </div>
      </div>
    </section>

    <section class="card history">
      <div class="label">RIWAYAT SUHU</div>
      <canvas id="chart" width="860" height="230"></canvas>

      <div class="meta">
        <div><b>MQTT Broker:</b> broker.emqx.io:8084 (WebSocket Secure)</div>
        <div><b>Topic:</b> <span id="topic"></span></div>
        <div><b>Update terakhir:</b> <span id="updated">Belum ada data</span></div>
      </div>
    </section>
  </main>

  <script>
    // 1. Topik disamakan dengan MQTT_TOPIC di ESP32
    const TOPIC = "iot-suhu/rendy-esp32-7f3a/dht22";

    // 2. DIUBAH KE EMQX: Menggunakan WSS port 8084 milik EMQX
    const BROKER = "wss://broker.emqx.io:8084/mqtt";

    const MAX_POINTS = 30;
    const values = [];
    const times = [];

    const statusEl = document.getElementById("status");
    const statusTextEl = document.getElementById("statusText");
    const tempEl = document.getElementById("temperature");
    const humidityEl = document.getElementById("humidity");
    const topicEl = document.getElementById("topic");
    const updatedEl = document.getElementById("updated");
    const canvas = document.getElementById("chart");
    const ctx = canvas.getContext("2d");

    topicEl.textContent = TOPIC;

    function setStatus(text, type = "") {
      statusEl.className = `status ${type}`;
      statusTextEl.textContent = text;
    }

    function redrawChart() {
      const width = canvas.width;
      const height = canvas.height;

      ctx.clearRect(0, 0, width, height);

      // Background
      ctx.fillStyle = "#0e1526";
      ctx.fillRect(0, 0, width, height);

      if (values.length === 0) {
        ctx.fillStyle = "#8f9ab0";
        ctx.font = "16px Arial";
        ctx.textAlign = "center";
        ctx.fillText("Menunggu data suhu...", width / 2, height / 2);
        return;
      }

      const pad = 42;
      const chartW = width - pad * 2;
      const chartH = height - pad * 2;

      const minData = Math.min(...values);
      const maxData = Math.max(...values);
      const spread = Math.max(maxData - minData, 1);
      const minY = minData - spread * 0.15;
      const maxY = maxData + spread * 0.15;

      // Grid
      ctx.strokeStyle = "#26314b";
      ctx.lineWidth = 1;

      for (let i = 0; i <= 4; i++) {
        const y = pad + (chartH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(width - pad, y);
        ctx.stroke();
      }

      // Labels min/max
      ctx.fillStyle = "#8f9ab0";
      ctx.font = "12px Arial";
      ctx.textAlign = "left";
      ctx.fillText(`${maxY.toFixed(1)}°C`, 4, pad + 4);
      ctx.fillText(`${minY.toFixed(1)}°C`, 4, height - pad);

      if (values.length === 1) {
        const x = width / 2;
        const y = height - pad - ((values[0] - minY) / (maxY - minY)) * chartH;

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 3;
      ctx.beginPath();

      values.forEach((value, index) => {
        const x = pad + (chartW * index / (values.length - 1));
        const y = height - pad - ((value - minY) / (maxY - minY)) * chartH;

        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });

      ctx.stroke();

      // Points
      values.forEach((value, index) => {
        const x = pad + (chartW * index / (values.length - 1));
        const y = height - pad - ((value - minY) / (maxY - minY)) * chartH;

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function handleMessage(payload) {
      try {
        const data = JSON.parse(payload.toString());

        // Membaca 'temperature' dan 'humidity' dari payload JSON ESP32
        const suhu = Number(data.temperature);
        const kelembapan = Number(data.humidity);

        if (!Number.isFinite(suhu)) {
          throw new Error("Nilai suhu tidak valid");
        }

        tempEl.textContent = suhu.toFixed(1);
        humidityEl.textContent = Number.isFinite(kelembapan) ? kelembapan.toFixed(1) : "--.-";

        values.push(suhu);
        times.push(new Date());

        if (values.length > MAX_POINTS) values.shift();
        if (times.length > MAX_POINTS) times.shift();

        updatedEl.textContent = new Date().toLocaleTimeString("id-ID");
        redrawChart();
      } catch (error) {
        console.error("Payload tidak valid:", error);
      }
    }

    // ID unik untuk dashboard browser
    const clientId = "web-dashboard-" + Math.random().toString(16).slice(2);

    const client = mqtt.connect(BROKER, {
      clientId,
      clean: true,
      reconnectPeriod: 2000,
      connectTimeout: 10000
    });

    client.on("connect", () => {
      setStatus("Terhubung ke MQTT", "connected");

      client.subscribe(TOPIC, { qos: 0 }, (error) => {
        if (error) {
          console.error("Subscribe gagal:", error);
          setStatus("Subscribe gagal", "error");
        } else {
          console.log("Subscribe berhasil ke: " + TOPIC);
        }
      });
    });

    client.on("message", (topic, payload) => {
      handleMessage(payload);
    });

    client.on("error", (error) => {
      console.error("MQTT Error: ", error);
      setStatus("Koneksi Error", "error");
    });
    
    client.on("close", () => {
      setStatus("Mencoba menyambung ulang...", "");
    });
  </script>
</body>
</html>
